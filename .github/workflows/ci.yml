name: KoperasiKu CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "feat/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  laravel-qa:
    name: Laravel QA & Feature Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: koperadata_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d koperadata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, pgsql, mbstring, xml, bcmath, zip, gd
          coverage: none

      - name: Install Composer dependencies
        working-directory: apps/web
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        working-directory: apps/web
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Automated QA Tests
        working-directory: apps/web
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: koperadata_test
          DB_USERNAME: postgres
          DB_PASSWORD: secret
        run: php artisan test

  ml-service-check:
    name: Python ML FastAPI Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ML dependencies & run endpoint smoke tests
        run: |
          pip install -r services/ml/requirements.txt httpx
          python -c "import sys; sys.path.append('services/ml'); from fastapi.testclient import TestClient; from main import app; c = TestClient(app); assert c.get('/health').status_code == 200; assert c.post('/predict/demand', json={'product_id': 1}).status_code == 200; assert c.post('/predict/credit-risk', json={'credit_limit': 1000, 'current_debt': 500, 'overdue_count': 1}).status_code == 200; print('[OK] ML FastAPI smoke tests passed!')"